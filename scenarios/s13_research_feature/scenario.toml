# S13 — research-сценарий, вариант V5 и САМЫЙ ТЯЖЁЛЫЙ: compound-цепочка
# research → planning → coding → testing. Research-агент составляет ПЛАН
# доработки — задачу через create_feature_request (upstream drcode agent.py:
# тулы создания задач есть только у research-агента; kind=feature встаёт в
# ХВОСТ очереди, в отличие от бага в S12) — с ПОЛНЫМ списком мест изменения,
# и порождённая feature выполняется ПОЛНЫМ пайплайном coding → testing.
#
# Сид спроектирован под канонический список ровно из N=5 мест: пакет
# telemetry/ из пяти однотипных модулей, каждый считает средний уровень
# устаревшей конструкцией «math.floor(сумма / окно)». Токен math.floor
# встречается в дереве РОВНО 5 раз — по одному на модуль, только в целевых
# строках (ни в одном докстринге, комментарии, README или тесте его нет —
# проверено checks.py по сиду). Замена «math.floor(x / y)» → «x // y»
# сохраняет результат (чтения неотрицательны), поэтому тест-сьют ЗЕЛЁНЫЙ
# в сиде и НЕ зависит от паттерна — pytest не может ни подсказать список
# мест, ни провалиться от самой замены.
#
# Бриф (kind="research") НЕ содержит ответов: ни путей модулей, ни их
# числа — только паттерн и формат плана (маркированный список путей от
# корня репозитория). Прямая авторизация create_feature_request
# ОБЯЗАТЕЛЬНА: docstring тула требует явного разрешения пользователя
# («Use ONLY when the user explicitly asked for it»), иначе агент уйдёт в
# ask_clarifying_question вместо создания задачи.
#
# [settle] НЕ задаёт verification: research-таргет заканчивается mark_done
# без метки (verification="passed" с research-брифом — ошибка загрузки,
# bench/scenario.py). Дефолтный settle-критерий (§4) сам держит ран,
# ПОКА ПОРОЖДЁННАЯ FEATURE не разработана и не протестирована: пока она
# ACTIVE/TESTING или в очереди — сеттла нет (queue not empty / status).
# Compound-природа принята сознательно: таймаут заложен с запасом на ТРИ
# цикла (research + coding + testing порождённой feature). Валидация
# списка путей происходит checks.py ПОСЛЕ реализации — это ок: список в
# описании порождённой задачи от этого не меняется.

id = "s13_research_feature"
timeout = 60  # minutes — soft limit (§4), три полных цикла compound-цепочки

[[briefs]]
title = "Составьте задачу на перевод телеметрии на целочисленное деление"
kind = "research"
text = """
В репозитории есть пакет telemetry/: пять модулей датчиков, каждый
считает средний уровень метрики за окно наблюдения устаревшей
конструкцией math.floor(...) с обычным делением. Проект стандартизовал
целочисленное деление оператором // — эта конструкция подлежит замене.

Составьте задачу на доработку: замените конструкцию math.floor(...)
на целочисленное деление // во ВСЕХ местах, где она используется.
Создайте задачу инструментом create_feature_request — разрешение
дано заранее, не спрашивайте подтверждения и не задавайте уточняющих
вопросов, поручение финальное.

В описании задачи перечислите маркированным списком ВСЕ файлы (пути
от корня репозитория), где нужно внести изменения, и укажите, что
именно заменить в каждом. Список должен быть полным: задача уйдёт
в работу как есть, по этому списку кодер будет вносить правки.

Сами файлы не изменяйте: составление плана — работа этой задачи,
реализация — работа порождённой задачи.
"""
