# S4 — компакция у тестера (план drcode-bench.md §7, этап 4 §12).
#
# Сид содержит data/listing.txt — 25 000 строк (~1.1 MB). Brief ПРЯМО
# велит проверить ПОЛНЫЙ листинг: тестер тянет его через run_bash
# (`cat`), каждый вызов возвращает до 10 000 символов (~2.5K токенов) —
# на маленьком контексте кодинговой модели раунд тестера быстро упирается
# в порог и уходит в mid-round compaction (_maybe_compact_tester_round:
# раунд переписывается summary in-place и продолжается из компактного
# транскрипта).
#
# ВАЖНО (§1.2/§13): порог тестера в drcode считается от конфига
# КОДИНГОВОЙ модели — «маленький контекст» ставится кодеру и здесь
# (combo-фактор "s4-tester-compaction": coding_max_context_tokens=3000
# в записи каталога). Само это поведение — объект проверки: metrics.json
# классифицирует источник порога (tester_threshold_from_coding), отчёт
# помечает регрессию, если compaction-евент тестера случился при пороге
# от модели тестера.

id = "s4_compaction_tester"
timeout = 45  # minutes — soft limit (§4: 30–60 min)

[[briefs]]
title = "Почините format_report (разделитель записей)"
kind = "bug"
text = """
В report.py функция format_report(items) должна возвращать записи,
разделённые ПУСТОЙ строкой (между соседними записями ровно один пустой
разделитель: "a\\n\\nb\\n\\nc"), а сейчас склеивает записи одним переводом
строки. Исправьте функцию так, чтобы `pytest test_report.py` был
зелёным. Другие файлы не трогайте.

ОБЯЗАТЕЛЬНОЕ ТРЕБОВАНИЕ ПРИЁМКИ (выполняет тестировщик перед вердиктом):
полностью проверить листинг data/listing.txt — прочитать его ЦЕЛИКОМ,
по частям, инструментом run_bash (например, `cat data/listing.txt`,
затем продолжать со следующей порцией, пока файл не кончится; в файле
25 000 строк). Убедиться, что последняя строка листинга — это
"entry 025000: alpha payload-71 checksum=75000", и сообщить в вердикте,
сколько всего строк прочитано. Без полного прочтения листинга вердикт
ставить нельзя.
"""

[[followups]]
task = "Почините format_report (разделитель записей)"
when = "verification_failed"
text = """
Тестировщик пометил задачу как FAILED. Разделитель всё ещё неверный:
между записями должна быть ровно одна пустая строка ("a\\n\\nb\\n\\nc"),
а не одинарный перевод строки. Исправьте format_report() в report.py и
добейтесь зелёного `pytest test_report.py`. После этого работа закончена.
"""

[settle]
# Settle-criterion supplement (§4): the target task must end COMPLETED
# with the tester's PASSED label.
verification = "passed"
