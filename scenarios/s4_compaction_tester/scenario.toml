# S4 — компакция у тестера (план drcode-bench.md §7, этап 4 §12).
#
# Сид содержит data/listing.txt — 4 500 строк (~205 KB ≈ ~50K токенов;
# размер подобран из механики компакций: их число ≈ полный_объём_чтения /
# (порог 24000 − ~2.5K токенов за вызов run_bash) ≈ 2 → 1–2 компакции
# тестера и ~20 ходов чтения). Объём сокращён с 10 256 строк (~460 KB ≈
# ~115K токенов, 4–6 компакций): в прогоне 20261027-152857
# (s4_compaction_tester × deepseek-v4-baseline) при старом объёме (а)
# КОДЕР прочитал весь листинг (~30 мин dev_s впустую — бриф тогда не
# запрещал ему это явно; теперь бриф прямо говорит кодеру, что листинг
# только для приёмочной проверки тестировщиком), а (б) тестеру на
# медленной модели (p50 ~23 с/запрос) не хватило бюджета: ~46 запросов +
# 4–5 компакций ≈ 25–35 мин — третья mid-round компакция была убита
# таймаутом. Новый бюджет рассчитан на медленные модели (p50 ~23
# с/запрос): ~20 запросов чтения + 1–2 компакции ≈ 10–15 мин тестера,
# итого прогон ~15–20 мин — укладывается в timeout = 45 минут с запасом
# (25 000 строк и вовсе давали 12–21 компакцию и срыв по времени).
# Brief ПРЯМО
# велит проверить ПОЛНЫЙ листинг: тестер тянет его через run_bash
# (`cat`), каждый вызов возвращает до 10 000 символов (~2.5K токенов) —
# бриф ЗАПРЕЩАЕТ пакетные чтения (несколько параллельных run_bash за ход:
# ход из ~10 параллельных `cat` добавляет ~23K токенов и физически не
# помещается в кап тестера — компакция не успевает за приростом), см.
# «ОБЯЗАТЕЛЬНОЕ ТРЕБОВАНИЕ ПРИЁМКИ» ниже. Кап тестера (секция [context])
# подобран так, чтобы прирост 2.5K токенов за ход не перевыполнял порог
# компакции каждый ход (иначе threshold-livelock-guard, см. [context]).
# На маленьком контексте модели ТЕСТЕРА раунд тестера быстро упирается
# в порог и уходит в mid-round compaction (_maybe_compact_tester_round:
# раунд переписывается summary in-place и продолжается из компактного
# транскрипта).
#
# ВАЖНО (§1.2, drcode ≥ 0.5.0): модели разрешаются ПЕР-РОЛЕВО — mid-round
# гейт тестера считает порог от конфига МОДЕЛИ ТЕСТЕРА
# (_fill_over_threshold(..., AgentRole.TESTER), знаменатель —
# resolved_config(AgentRole.TESTER).max_context_tokens). «Маленький
# контекст» поэтому ставится тестеру — секцией [context] самого сценария
# (ниже): «как вызвать компакцию» — знание сценария, а не матрицы
# (прецедент — [proxy] у S7; приоритет сценарий → combo → каталог, §1.2).
# Само это поведение — объект проверки: metrics.json классифицирует
# источник порога (tester_threshold_from_tester), отчёт помечает
# регрессией порог, посчитанный от кодинговой модели (допер-ролевое
# поведение drcode < 0.5.0).

id = "s4_compaction_tester"
timeout = 45  # minutes — soft limit (§4: 30–60 min)

[context]
# Кап МОДЕЛИ ТЕСТЕРА: mid-round гейт тестера делит на конфиг тестеровой
# модели (план §1.2). Кап попадает в entry каталога models.json.
# 6000 НЕДОСТАТОЧНО даже для последовательного чтения: порция `cat` —
# до 10 000 символов ≈ 2.5K токенов за ход, порог компакции 80% от 6000
# = 4800 токенов → компакция каждые 1–2 хода → 3 подряд без «2 наблюдений
# под порогом» → threshold-livelock-guard выключает гейт, последний раунд
# остаётся без summary. 30000 даёт запас: один ход ≤ ~2.5K токенов,
# порог 24000 достигается за ~9 ходов, после компакции счётчик наблюдений
# успевает сброситься (livelock-guard не срабатывает); даже «пакетный»
# ход (~10 × 2.5K = 25K) остаётся под hard-limit 97% (29100). Полный
# объём чтения листинга (~50K токенов) при этом даёт 1–2 компакции
# тестера — механизм mid-round (_maybe_compact_tester_round) проверен,
# а wall-clock укладывается в timeout (при старом листинге на ~115K
# токенов компакций было 4–5 и прогон 20261027-152857 на медленной
# модели упёрся в таймаут — см. шапку).
# coding = 18000
tester = 30000

[[briefs]]
title = "Почините format_report (разделитель записей)"
kind = "bug"
text = """
В report.py функция format_report(items) должна возвращать записи,
разделённые ПУСТОЙ строкой (между соседними записями ровно один пустой
разделитель: "a\\n\\nb\\n\\nc"), а сейчас склеивает записи одним переводом
строки. Исправьте функцию так, чтобы `pytest test_report.py` был
зелёным. Другие файлы не трогайте.

Кодеру — дисциплина минимума действий (правка известна заранее,
исследование репозитория не нужно):
1. Правка — ОДНА строка: в report.py в функции format_report() замените
   `return "\\n".join(items)` на `return "\\n\\n".join(items)`. Больше
   ничего в коде не меняйте.
2. НЕ исследуйте другие файлы, НЕ открывайте data/listing.txt (он
   предназначен только для приёмочной проверки тестировщиком), НЕ ищите
   другие вхождения разделителя "\\n" по репозиторию, НЕ читайте
   test_report.py — сид теста вам уже известен: единственный тест
   падает из-за неверного разделителя.
3. НЕ запускайте pytest ДО внесения правки (сид уже известен: тест
   падает из-за разделителя — повторять это экспериментально не нужно).
4. После внесения правки прогоните `pytest test_report.py` РОВНО ОДИН
   раз и завершайте работу: повторные прогоны, перепроверки и
   дополнительные запуски не нужны.

ОБЯЗАТЕЛЬНОЕ ТРЕБОВАНИЕ ПРИЁМКИ (выполняет тестировщик перед вердиктом):
полностью проверить листинг data/listing.txt — прочитать его ЦЕЛИКОМ,
по частям, инструментом run_bash (например, `cat data/listing.txt`,
затем продолжать со следующей порцией, пока файл не кончится; в файле
4 500 строк). Читай СТРОГО ПО ОДНОЙ ПОРЦИИ ЗА ЗАПРОС: не запускай
несколько вызовов run_bash параллельно в одном ходе — следующую порцию
запрашивай только после получения ответа на предыдущую. Читай СТРОГО
ПОДРЯД, начиная с первой строки файла: каждая следующая порция должна
начинаться со строки, следующей за последней строкой, реально показанной
в предыдущем ответе инструмента (если ответ обрезан — продолжай с
последней показанной строки, не с конца запрошенного диапазона).
Выборочное чтение (фрагменты вразброс, только начало/середина/конец
файла, отдельные диапазоны с пропусками) полным прочтением НЕ считается.
Убедиться, что последняя строка листинга — это
"entry 004500: epsilon payload-38 checksum=35500", и сообщить в вердикте,
сколько всего строк прочитано. Без полного прочтения листинга вердикт
ставить нельзя.

Если проверка не пройдена, считайте сбой НЕ связанным с правками этой
задачи: ставьте итоговый неуспешный вердикт, адресованный пользователю,
не возвращая задачу в разработку циклом доработки.
"""

[[followups]]
task = "Почините format_report (разделитель записей)"
when = "verification_failed"
text = """
Тестировщик пометил задачу как FAILED. Разделитель всё ещё неверный:
между записями должна быть ровно одна пустая строка ("a\\n\\nb\\n\\nc"),
а не одинарный перевод строки. Исправьте format_report() в report.py и
добейтесь зелёного `pytest test_report.py`. После этого работа закончена.
"""

[settle]
# Settle-criterion supplement (§4): the target task must end COMPLETED
# with the tester's PASSED label.
verification = "passed"
