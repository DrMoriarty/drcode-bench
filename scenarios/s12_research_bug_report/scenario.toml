# S12 — research-сценарий, вариант V4: агент находит ЛАТЕНТНЫЙ дефект
# чтением кода и заводит багрепорт инструментом create_bug_report
# (upstream drcode agent.py: research-агент — единственный носитель
# тулов создания задач); порождённая задача kind=bug, origin="system"
# (TaskManager.create) встаёт в голову очереди и выполняется ПОЛНЫМ
# пайплайном coding → testing.
#
# Принципиальное отличие сида от S2a: тест-сьют ЗЕЛЁНЫЙ — дефект
# (batches_needed теряет остаток: докстринг обещает
# batches_needed(35, 10) == 4, код возвращает items // per_batch == 3)
# лежит вне покрытия тестов, поэтому «прогони pytest» дефект НЕ
# находит. Единственный путь — сверка кода с контрактом докстринга.
# Маркеров («bug», «FIXME», «TODO») в сиде нет, дефект ровно один;
# соседний dispatch/labels.py и вторая функция pricing.py
# (volume_tier) чисты — их докстринги и код согласованы.
#
# Прямая авторизация в брифе ОБЯЗАТЕЛЬНА: docstring create_bug_report
# требует явного разрешения пользователя («Use ONLY when the user
# explicitly asked for it»), иначе агент уйдёт в
# ask_clarifying_question вместо создания задачи.
#
# [settle] НЕ задаёт verification (портить картину research-таргет без
# метки нельзя; verification="passed" с research-брифом — ошибка
# загрузки сценария, bench/scenario.py). Дефолтный settle-критерий
# (§4) сам держит ран до тех пор, пока порождённый баг не разработан и
# не протестирован: пока задача бага ACTIVE/TESTING или в очереди —
# ран не сеттлится. PASSED порождённого бага проверяет checks.py.
# Таймаут заложен с запасом на ДВА полных цикла (research + bug).

id = "s12_research_bug_report"
timeout = 45  # minutes — soft limit (§4: 30–60 min), два полных цикла

[[briefs]]
title = "Проверьте dispatch/pricing.py на ошибки в логике"
kind = "research"
text = """
В репозитории небольшой пакет службы доставки: модули
dispatch/pricing.py (расчёт партий отгрузки и тарифных ярусов) и
dispatch/labels.py (трек-номера).

Проверьте модуль dispatch/pricing.py на предмет ошибок в логике:
сверяйте поведение функций с контрактами, зафиксированными в
докстрингах. Тесты зелёные — проблему ищите чтением кода, прогон
тестов её не проявляет.

Если найдёте проблему — СРАЗУ заведите багрепорт инструментом
create_bug_report. Описание репорта должно называть: что именно не
так, в каком файле и какой функции, и как проявляется (конкретный
вызов и расхождение факта с контрактом). Разрешение на заведение
репорта дано ЗАРАНЕЕ: пользователь поручил заводить репорт
на каждый найденный дефект — не спрашивайте разрешения и не задавайте
уточняющих вопросов, заводите репорт сразу.

Исходные файлы не изменяйте: починка дефекта — работа отдельной задачи,
которая будет создана из багрепорта.
"""
