# S3 — компакция у кодера (план drcode-bench.md §7, этап 4 §12).
#
# Задача требует прочитать ВСЕ модули каталога glossary/ (18 файлов с
# развёрнутыми определениями, суммарно ~46 KB ≈ ~10–12K токенов).
# При max_context_tokens = 5000 у КОДИНГОВОЙ модели (секция [context]
# ниже, план §1.2) суммарный объём чтения заведомо превышает кап с
# запасом ≥ 2×, поэтому компакция наступает при ЛЮБОЙ стратегии
# чтения — в том числе при батч-чтении всех модулей одним ходом
# (порог компакции 80% от 5000 = 4000 токенов пересекается уже на
# ~40% каталога, а одиночный батч-ход ~10K+ токенов пересекает его
# гарантированно). Компакция проходит либо mid-run (pause →
# sanitized_messages → unfinished=True → summary → continuation-turn),
# либо на границе turn'ов (_maybe_compact). Оба пути легитимны; факт
# компакции проверяет checks.py, путь фиксируется в metrics.json.
# Размер подобран с учётом комментария к [context] ниже: кап НЕ
# снижать — полоса между «пересёк порог» и threshold-livelock-guard
# узкая (см. аналогичный подбор капа в S4 scenario.toml).
#
# «Как вызвать компакцию» — знание сценария, а не матрицы: кап задан
# секцией [context] самого сценария (прецедент — [proxy] у S7), сценарий
# ПОБЕЖДАЕТ комбо при конфликте (приоритет сценарий → combo → каталог,
# §1.2). Никаких сервисных комбо в matrix.toml для этого не нужно.

id = "s3_compaction_coder"
timeout = 45  # minutes — soft limit (§4: 30–60 min)

[context]
# Кап КОДИНГОВОЙ модели: mid-run/turn-boundary гейты кодера считают порог
# от конфига кодинговой модели (план §1.2, drcode ≥ 0.5.0 — пер-ролевое
# разрешение моделей). Кап попадает в entry каталога models.json.
coding = 5000

[[briefs]]
title = "Измените вес термина kappa на 42 (каталог glossary/)"
kind = "feature"
text = """
В репозитории есть каталог glossary/ — 18 модулей, каждый определяет
ровно один термин: константы TERM и WEIGHT (каждый модуль снабжён
развёрнутой справочной документацией — читайте файлы целиком).

Правило работы: прежде чем что-либо менять, вы обязаны ПРОЧИТАТЬ КАЖДЫЙ
модуль каталога glossary/ целиком инструментом read_file (полный обзор
обязателен, выбирать модуль наугад или через grep нельзя — решение должно
опираться на содержимое всех файлов). По ходу чтения запоминайте TERM и
WEIGHT каждого модуля.

ДИСЦИПЛИНА ЧТЕНИЯ: читайте модули по одному-два за ход; следующий
запрос read_file — только после ответа на предыдущий. НЕ ВЫЗЫВАЙТЕ
read_file пакетно (несколько параллельных вызовов одним ходом
запрещены): определения объёмные, и пакетное чтение не даёт
воспринять содержимое каждого модуля по порядку.

Задача: найдите модуль термина "kappa" и измените его WEIGHT на 42.
Все остальные модули каталога не трогайте, тесты не трогайте, новые файлы
не добавляйте. Когда `pytest test_glossary.py` зелёный — работа закончена.
"""

[[clarification_answers]]
# Модель после нескольких компакций может решить, что дочитать каталог
# «физически невозможно», и спросить, как поступить (наблюдалось в прогонах
# 20261028-153218 rep1/rep2). Ответ-инструкция: продолжать чтение —
# уплотнением контекста система занимается сама.
match = ["контекст", "как поступить", "невозможн", "прочитать все 18"]
answer = """
Продолжайте работать по брифу: читайте модули по одному-два за ход, как
указано. Уплотнением контекста занимается система автоматически — это
штатная часть работы, останавливаться или менять стратегию чтения не нужно.
Дочитайте каталог и доведите задачу до конца (WEIGHT=42 у kappa, зелёный
`pytest test_glossary.py`).
"""

[settle]
# Settle-criterion supplement (§4): the target task must end COMPLETED
# with the tester's PASSED label.
verification = "passed"
