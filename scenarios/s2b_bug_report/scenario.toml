# S2b — the tester files a bug report (plan drcode-bench.md §7). Checks
# the bug-report queue path: the tester's create_bug_report task (kind=bug)
# must be executed BEFORE the other queued briefs (bugs sort newest-first
# at the head of TaskManager.queued()), pass its own testing round, and
# everything must end COMPLETED with the seed contract green.

id = "s2b_bug_report"
timeout = 45  # minutes — soft limit (§4: 30–60 min)

[[briefs]]
title = "Почините div() (ValueError вместо ZeroDivisionError)"
kind = "feature"
text = """
В calc.py функция div(a, b) при нулевом делителе бросает ZeroDivisionError,
а по контракту должна бросать ValueError.

Исправьте ТОЛЬКО div(). Функции pct() и export_api() НЕ трогайте: они вне
объёма этой задачи (их закрывают другие задачи). Проверьте себя точечно:
`pytest test_calc.py::test_div` должен быть зелёным. Остальные тесты могут
оставаться красными — это дефекты и нереализованные вещи ВНЕ объёма задачи.

КОДЕРУ: не создавайте новых задач (в том числе через create_bug_report) —
оформление баг-репортов — обязанность тестировщика; вещи вне объёма задачи
просто упомяните в итоговом отчёте/комментарии.

ТЕСТИРОВЩИКУ: если полный pytest красный только из-за вещей вне объёма
этой задачи (pct() сломана, export_api() ещё не реализована) — оформите
ОДИН bug-report через инструмент create_bug_report (в description: какие
проверки падают, команда и вывод) и поставьте ЭТОЙ задаче
set_verification(success=True): её собственный объём выполнен полностью.

В description этого bug-report'а ОБЯЗАТЕЛЬНО укажите дословно следующий
контракт — именно его получит верифицирующий тестировщик задачи
(«Original task:» в промпте верификации — это текст description):

«Известные внеобъёмные падения: test_calc.py::test_pct (в pct() нет
умножения на 100) и test_export.py (ImportError export_api). Этот
bug-report — та самая отдельная задача, которая закрывает оба дефекта;
никаких новых bug-report'ов по ним не оформлять. При верификации этой
задачи: если pytest test_calc.py::test_div зелёный —
set_verification(success=True), даже если полный сьют красный из-за
test_pct и test_export».
"""

[[briefs]]
title = "Реализуйте export_api()"
kind = "feature"
text = """
Добавьте в calc.py функцию export_api(): она возвращает список имён
публичных функций модуля в порядке их определения — ["div", "pct"].
Реализации div и pct не менять. Проверка: `pytest test_export.py` должен
быть зелёным. Не создавайте новых задач (в том числе через
create_bug_report): что-либо вне объёма этой задачи просто упомяните в
итоговом отчёте/комментарии.

ТЕСТИРОВЩИКУ: полный сьют может быть красным из-за
test_calc.py::test_pct — это известный внеобъёмный дефект, УЖЕ
зафиксированный отдельной задачей; новые bug-report'ы по нему не
оформлять. Если `pytest test_export.py` зелёный —
set_verification(success=True).
"""

[[clarification_answers]]
# The tester's bug-report task invites the coder to peek at the other red
# tests and ask what to do with them (observed in run
# 20261024-173446: «...вне объёма задачи #07fd139b — исправить их сейчас
# или оставить как есть (зарегистрировать как отдельные баги)?»). Any-of
# substrings over the question, case-insensitive — the model paraphrases
# run to run (same rationale as S5). The list covers the observed
# paraphrases of runs 20261027-211956 («внеобъёмных», spelled together)
# and 20261027-212623 («Как поступить с test_pct...»): no space in
# «внеобъём» and the named red test are separate entries on purpose —
# substring matching is purely literal, case-insensitive.
match = [
    "вне объёма",
    "внеобъём",
    "известных",
    "известные",
    "Как поступить",
    "Как оформить",
    "оставить как есть",
    "отдельные баги",
    "исправить их",
    "test_pct",
]
answer = """
Падения pct() и export_api() находятся вне объёма задачи — исправлять их сейчас
не нужно, дефекты уже зафиксированы отдельным bug-report'ом. Завершите текущую
задачу, ничего дополнительно не меняя.
"""

[settle]
# The label of the briefs is not constrained here on purpose: the S2b
# contract (queue priority, both briefs done, the bug task tested) is
# asserted mechanically by checks.py.
verification = "any"
