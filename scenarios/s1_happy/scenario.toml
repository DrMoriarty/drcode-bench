# S1 — happy path (plan drcode-bench.md §7): feature → coder → tester PASSED.
# Checks the basic chain: queue → coding → testing → COMPLETED with a
# verification label, exactly one testing round, mechanical checks green.

id = "s1_happy"
timeout = 45  # minutes — soft limit (§4: 30–60 min)

[[briefs]]
title = "Сделайте тест зелёным"
kind = "feature"
text = """
В репозитории лежит string_utils.py и падающий тест test_string_utils.py.

Исправьте функцию shout() в string_utils.py так, чтобы `pytest` проходил
полностью. Больше ничего в репозитории не меняйте: тесты не трогать,
новые файлы не добавлять. Когда pytest зелёный — работа закончена.
"""

[settle]
# Settle-criterion supplement (§4): every target task must end COMPLETED
# with the tester's PASSED label.
verification = "passed"
