# S2a — seeded bug → tester FAILED → user follow-up → fix → PASSED
# (plan drcode-bench.md §7). Checks the "return for rework" path: a FAILED
# verdict re-queues the task via TaskManager.send(), the follow-up comment
# reaches the coder as one prompt, the second testing round passes.

# NB on brief wording: the e2e test (tests/test_scenarios_e2e.py) scripts
# the coder via the fake gateway, which keys its round-1 fix on the
# literals "FAILED" / "test_pct" appearing in the prompt. The brief must
# NOT contain them (or the scripted coder would fix pct() on round 1 and
# the run would settle PASSED with a single testing round). Keep the
# verification rule paraphrased (no verdict-tool English, no test names).

id = "s2a_bug_followup"
timeout = 45  # minutes — soft limit (§4: 30–60 min)

[[briefs]]
title = "Почините div() (ValueError вместо ZeroDivisionError)"
kind = "bug"
text = """
В calc.py функция div(a, b) при нулевом делителе бросает ZeroDivisionError,
а по контракту должна бросать ValueError.

Исправьте ТОЛЬКО div(). Функцию pct() не трогайте: её починка вынесена
в отдельную задачу, и правки в ней будут конфликтовать с той задачей.
Не чините ничего вне этого объёма, даже если полный `pytest` остаётся
красным из-за других функций: проверка завершит задачу неуспешным
вердиктом, а объём будет расширен следующим сообщением пользователя.
Точечная самопроверка кодера: `pytest test_calc.py::test_div` — она должна
быть зелёной.

Правило верификации (обязательное, адресовано проверке задачи): прогоните
ПОЛНЫЙ `pytest` в корне задачи. ЛЮБОЙ упавший тест означает, что проверка
НЕ пройдена. Падение считается НЕ связанным с правками этой задачи
(дефект существовал вне её объёма), поэтому НЕ возвращайте задачу в
разработку циклом доработки: ставьте итоговый неуспешный вердикт,
адресованный пользователю, и заведите отчёт о дефекте — объём расширит
пользователь своим следующим комментарием. Вердикт «проверка пройдена»
возможен ТОЛЬКО при полностью зелёном `pytest`. Само по себе это правило
НЕ даёт права чинить что-либо вне указанного выше объёма.
"""

[[followups]]
task = "Почините div() (ValueError вместо ZeroDivisionError)"
when = "verification_failed"
text = """
Тестировщик пометил задачу как FAILED. Вот лог ошибки тестера: полный
pytest красный — падает test_pct (pct(50, 200) возвращает 0.25, ожидается
25.0). Объём задачи расширяется: теперь исправьте и pct() — не хватало
умножения на 100 — так, чтобы ПОЛНЫЙ `pytest` был зелёным. После этого
работа закончена.
"""

[[clarification_answers]]
# The follow-up lifts the round-1 "pct() untouchable" ban, but the coder
# still sees the original brief's prohibition in the task prompt and may
# legitimately ask how to proceed (observed in run 20261027-204649:
# «...дефект вне объёма задачи... правки в pct() прямо запрещены брифом.
# Как поступить?»). Any-of substrings over the question, case-insensitive —
# the model paraphrases run to run (same rationale as S2b/S5).
match = ["как поступить", "вне объёма", "запрещены брифом", "правки в pct"]
answer = """
Запрет «pct() не трогать» относился только к первому раунду задачи (починка
div()) и больше не действует: вашим follow-up-сообщением пользователь расширил
объём задачи, и исправление pct() теперь входит в её объём. Исправьте pct()
(не хватало умножения на 100) и добейтесь полностью зелёного `pytest`.
"""

[settle]
# Settle-criterion supplement (§4): the target task must end COMPLETED
# with the tester's PASSED label — i.e. the follow-up round really passed.
verification = "passed"
