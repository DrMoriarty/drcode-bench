[project]
name = "drcode-bench"
version = "0.1.0"
description = "Benchmark harness for the full drcode agent loop (coding → testing → compaction)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # drcode подключается субмодулем ./drcode (см. [tool.uv.sources] ниже).
    # Без субмодуля замените источник на git-зависимость:
    #   drcode = { git = "https://github.com/DrMoriarty/drcode.git" }
    "drcode",
    "textual>=8.2.8",
    "rich>=13.0",
    # §9 proxy mode: fault-injecting forward proxy on the real HTTP layer.
    # uvicorn serves the raw-ASGI proxy app; httpx forwards to the upstream
    # provider (openai already pulls both — pinned here explicitly).
    "uvicorn>=0.30",
    "httpx>=0.27",
    # tomllib входит в stdlib (python 3.11+), отдельная зависимость не нужна.
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4",
    "ruff>=0.17.1",
    "pyright[nodejs]>=1.1.414",
]

# Lint + format gate for bench/ and tests/ only. The `drcode/` submodule is a
# path dependency with its own gate — never lint or fix it from this repo.
[tool.ruff]
line-length = 100
src = ["bench", "tests"]
extend-exclude = ["drcode", "dist", "runs", "scenarios"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear (common bug patterns)
    "UP",       # pyupgrade (py3.12 idioms)
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]
ignore = [
    "E501",     # long lines in briefs/comments are fine; formatter handles code
    "SIM108",   # ternary is not always clearer
    # Scenario briefs and docs are written in Russian (project convention);
    # Cyrillic strings/docstrings/comments trip the homoglyph rules — by design.
    "RUF001", "RUF002", "RUF003",
]

[tool.pyright]
include = ["bench", "tests"]
exclude = ["drcode", "dist", "runs", ".venv"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = true

[tool.uv.sources]
drcode = { path = "drcode" }

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
